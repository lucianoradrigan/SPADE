[project]
name = "driveflow"
version = "0.2.0"
description = "A unified simulation, differentiable predictive control (DPC), and ML fault-diagnosis platform for electric drives -- config-driven classifiers/regressors with edge deployment (Raspberry Pi 5/ESP32 TFLite, TI C2000 float32 C export) and rule-based monitoring agents, ships as the 'driveflow' Python package."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "tensorflow",
    "gymnasium",
    "pyyaml",
    "scikit-learn",
    "threadpoolctl",
    # LiteRT, the replacement for the deprecated tf.lite.Interpreter (driveflow/ai/litert.py). No wheel
    # exists for Intel Macs on Python 3.12, so there SPADE keeps using TensorFlow's interpreter.
    "ai-edge-litert; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["streamlit", "plotly"]
# FMU co-simulation plants (round PLECS/OM, decision D3): fmpy loads FMI 2.0 FMUs, e.g. the
# OpenModelica plants of modelica/SPADE (built with scripts/fmu/build_fmus.sh, or downloaded with
# `python -m driveflow.fmu fetch`). Not needed for anything else.
fmu = ["fmpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driveflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Category markers (docs/VALIDATION_SUMMARY.md): select with -m, e.g. `pytest -m "simulation and not slow"`.
markers = [
    "simulation: numerical stability / reproducibility of the plant models (tests/simulation)",
    "control: closed-loop controller performance against reference models (tests/control)",
    "ai: classifier evaluation, monitoring agents and alerts (tests/ai)",
    "compat: installation smoke checks that must pass on Linux, Windows and macOS (tests/compat)",
    "slow: > ~20 s each; excluded from the per-commit CI job, run by the scheduled/manual workflow",
    "fmu: needs fmpy and a built FMU under data/fmu/; skipped (not failed) when either is missing",
    "llm: talks to a real local model runtime (Ollama); skipped unless pytest --run-llm (decision B4: the suite needs no network or GPU)",
]
