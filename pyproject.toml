[project]
name = "driveflow"
version = "0.1.0"
description = "A unified simulation, differentiable predictive control (DPC), and ML fault-diagnosis platform for electric drives -- config-driven classifiers/regressors with edge (Raspberry Pi 5/ESP32) deployment and rule-based monitoring agents, ships as the 'driveflow' Python package."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "tensorflow",
    "gymnasium",
    "pyyaml",
    "scikit-learn",
    "threadpoolctl",
]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["streamlit", "plotly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driveflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Category markers (docs/VALIDATION_SUMMARY.md): select with -m, e.g. `pytest -m "simulation and not slow"`.
markers = [
    "simulation: numerical stability / reproducibility of the plant models (tests/simulation)",
    "control: closed-loop controller performance against reference models (tests/control)",
    "ai: classifier evaluation, monitoring agents and alerts (tests/ai)",
    "compat: installation smoke checks that must pass on Linux, Windows and macOS (tests/compat)",
    "slow: > ~20 s each; excluded from the per-commit CI job, run by the scheduled/manual workflow",
]
