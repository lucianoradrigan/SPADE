# Plant catalog (round Assistant, task F0.4): what each native plant lets a caller configure,
# in which unit and convention, and in which range. Read by driveflow.datagen.plant_catalog.
#
# Single source rules (tests/test_assistant_f0_plant_catalog.py):
# - every Scenario field appears here, and every plant is either in applies_to or in
#   not_applicable for it;
# - every field named here exists in Scenario;
# - every range is checked against Scenario.__post_init__ with a value just inside and just
#   outside each bound (range: null means Scenario checks only the type/finiteness, or nothing,
#   as `validated` says);
# - defaults are NOT written here: describe_plant() reads them from the code (Scenario's field
#   defaults, the motor classes, pmsm_foc.MOTOR_PARAMS, BuckParams). default_source says where.
#
# Conventions follow docs/assistant/RELEVAMIENTO_DATASHEETS_2026-11-02.md §3 and §8: per phase vs
# line-to-line, rms vs peak, temperature. importance: required | important | optional.

version: 1
plants:
  dc_perm_ex_v1: {title: "Permanently excited DC motor (GEM, Heinzmann PMG 132 parameters), one-quadrant converter", controllers: [PI, MPC]}
  dc_pmg132_v1: {title: "Permanently excited DC motor with the Perm-Motor PMG 132 datasheet values at 60 V (S-20), one-quadrant converter", controllers: [PI, MPC]}
  dc_perm_ex_v2: {title: "Permanently excited DC motor (GEM, Heinzmann PMG 132 parameters), one-quadrant converter in discontinuous conduction (S-21 corrected; dcm_exact)", controllers: [PI, MPC]}
  dc_pmg132_v2: {title: "Permanently excited DC motor with the Perm-Motor PMG 132 datasheet values at 60 V, one-quadrant converter in discontinuous conduction (S-21 corrected; dcm_exact)", controllers: [PI, MPC]}
  pmsm_v1: {title: "Salient PMSM, dq current control near standstill (current-step bench)", controllers: [FOC_MTPA, FOC_naive]}
  vsc_dpc_v1: {title: "Voltage source converter with L-C filter, DPC neural controller", controllers: [DPC]}
  buck_v1: {title: "Averaged synchronous buck converter, PI cascade", controllers: [PI]}

fields:
  scenario_id:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: required
    validated: false
    range: null
    description: "Unique run name; becomes dataset_id and source_file in the export."
  controller_type:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: required
    range: null
    allowed_per_plant: {dc_perm_ex_v1: [PI, MPC], dc_pmg132_v1: [PI, MPC], dc_perm_ex_v2: [PI, MPC], dc_pmg132_v2: [PI, MPC], pmsm_v1: [FOC_MTPA, FOC_naive], vsc_dpc_v1: [DPC], buck_v1: [PI]}
    description: "Controller of the run; each plant accepts only its own controllers."
  plant_config_id:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: required
    range: null
    description: "Which plant to simulate."
  seed:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: optional
    validated: false
    range: null
    description: "Reproducibility seed (DC: plant randomness, vibration and noise; VSC: the reference's start phase; PMSM and buck: recorded, deterministic runs)."
  duration_s:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: s
    importance: important
    range: {min: 0.0, min_inclusive: false}
    description: "Simulated time of the run."
  omega_ref_rad_s:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: rad/s
    convention: "mechanical shaft speed"
    importance: important
    range: {}
    description: "Speed reference of the speed PI/MPC. The one-quadrant converter cannot track negative references or brake."
  fault_type:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: important
    validated: false
    range: null
    description: "None (healthy), outer_race, inner_race, ball, cage, or a custom label with fault_order_override."
  electrical_severity:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: N*m
    convention: "amplitude of the bearing-fault torque ripple (MCSA path)"
    importance: optional
    range: {min: 0.0, min_inclusive: true}
    description: "Electrical fault severity; only acts when a fault is active."
  mechanical_severity:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: "vibration model units"
    convention: "impulse amplitude of the synthetic vibration model (Module B)"
    importance: optional
    range: {min: 0.0, min_inclusive: true}
    description: "Mechanical fault severity; default is the calibrated value of the fault type."
  motor_parameter_overrides:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: important
    range: null
    default_source: "dc_perm_ex_v1: DcPermanentlyExcitedMotor._default_motor_parameter (GEM); dc_pmg132_v1: runner.PMG132_MOTOR_PARAMETER (datasheet); dc_perm_ex_v2 / dc_pmg132_v2: as their v1"
    description: "Partial override of the DC motor's electrical and mechanical parameters."
    keys:
      r_a: {unit: ohm, convention: "armature circuit resistance (two-terminal, brushes included as given by the datasheet); temperature not stated by GEM: prefer the cold value and say so", range: {min: 0.0, min_inclusive: false}}
      l_a: {unit: H, convention: "armature circuit inductance", range: {min: 0.0, min_inclusive: false}}
      psi_e: {unit: V*s/rad, convention: "flux constant = back-EMF constant Ke in V*s/rad = torque constant Kt in N*m/A (SI)", range: {min: 0.0, min_inclusive: false}}
      j_rotor: {unit: kg*m^2, convention: "rotor inertia only; the load adds j_load = 0.0025", range: {min: 0.0, min_inclusive: false}}
  electrical_noise_pct:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: "%"
    convention: "white noise on current_r, as % of the run's own standard deviation"
    importance: optional
    range: {min: 0.0, min_inclusive: true}
    description: "Sensor noise on the current, added after the run."
  mechanical_noise_pct:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: "%"
    convention: "white noise on each acceleration axis, as % of that axis's standard deviation"
    importance: optional
    range: {min: 0.0, min_inclusive: true}
    description: "Sensor noise on the vibration channels, added after the run."
  torque_ref_nm:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: N*m
    importance: optional
    range: {}
    description: "Torque-control mode (bypasses the speed loop); omega_ref_rad_s is then ignored."
  fault_order_override:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: "multiple of shaft speed"
    importance: optional
    range: {min: 0.0, min_inclusive: false}
    description: "Characteristic fault frequency as an order; makes fault_type a free label."
  extra_faults:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: optional
    range: null
    description: "Additional simultaneous faults, as (fault_type, order_override) pairs."
  load_resistance_ohm:
    applies_to: [vsc_dpc_v1, buck_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1]
    unit: ohm
    convention: "resistive load across the output capacitor"
    importance: important
    range: {min: 0.0, min_inclusive: false}
    default_source: "VSC: runner._VSC_R_OHM = 8.0064 (the DPC training load); buck: 6 ohm"
    description: "Output load. VSC below R* = 3.37 ohm is open-loop unstable (physics, not rejected)."
  reference_magnitude_v:
    applies_to: [vsc_dpc_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, buck_v1]
    unit: V
    convention: "magnitude of the rotating voltage reference (complex phasor)"
    importance: important
    range: {min: 0.0, min_inclusive: true}
    default_source: "RotatingReference default, 50 V"
    description: "Reference voltage magnitude; the network was trained at 50 V."
  reference_omega_rad_s:
    applies_to: [vsc_dpc_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, buck_v1]
    unit: rad/s
    convention: "electrical angular frequency of the reference"
    importance: optional
    range: {}
    default_source: "RotatingReference default, 2*pi*50"
    description: "Reference frequency; the network was trained at 50 Hz."
  pi_setpoint_weight:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: optional
    range: {min: 0.0, min_inclusive: true, max: 1.0, max_inclusive: true}
    default_source: "PICascadeController default b = 1"
    description: "Setpoint weight b of the speed PI's proportional term (PI only)."
  pmsm_current_ref_a:
    applies_to: [pmsm_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, vsc_dpc_v1, buck_v1]
    unit: A
    convention: "signed stator current magnitude |i_s| (amplitude-invariant dq, peak per phase); sign = sign of i_q"
    importance: required
    range: {min: -400.0, min_inclusive: true, max: 400.0, max_inclusive: true}
    description: "Stator current reference, split into (i_d, i_q) by the policy."
  vsc_voltage_limit_v:
    applies_to: [vsc_dpc_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, buck_v1]
    unit: V
    convention: "per-axis clamp of the converter voltage command"
    importance: optional
    range: {min: 0.0, min_inclusive: false}
    description: "Converter voltage limit; 134 V reproduces the original converter (S-09). None: unlimited."
  vsc_capacitor_scale:
    applies_to: [vsc_dpc_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, buck_v1]
    unit: "fraction of 15 uF"
    importance: optional
    range: {min: 0.0, min_inclusive: false}
    description: "Synthetic capacitor degradation (effective C); synthetic-only fault."
  vsc_esr_ohm:
    applies_to: [vsc_dpc_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, buck_v1]
    unit: ohm
    importance: optional
    range: {min: 0.0, min_inclusive: true}
    description: "Synthetic series ESR of the filter capacitor."
  buck_vout_ref_v:
    applies_to: [buck_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1]
    unit: V
    importance: important
    range: {min: 0.0, min_inclusive: true, max: 48.0, max_inclusive: false}
    range_note: "upper bound is buck_vin_v (48 V by default): a buck cannot step up"
    default_source: "24 V (runner)"
    description: "Output voltage reference."
  buck_vin_v:
    applies_to: [buck_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1]
    unit: V
    importance: important
    range: {min: 24.0, min_inclusive: false}
    range_note: "must exceed buck_vout_ref_v (24 V by default); on its own only > 0 is required"
    default_source: "48 V (BuckParams)"
    description: "Input voltage."
  buck_load_step_ohm:
    applies_to: [buck_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1]
    unit: ohm
    importance: optional
    range: {min: 0.0, min_inclusive: false}
    description: "Load after the step; None: no step."
  buck_load_step_time_s:
    applies_to: [buck_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1]
    unit: s
    importance: optional
    range: {min: 0.0, min_inclusive: true}
    default_source: "half of duration_s"
    description: "Time of the load step."
  buck_parameter_overrides:
    applies_to: [buck_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1]
    unit: null
    importance: optional
    range: null
    default_source: "sim/buck_system.BuckParams"
    description: "Partial override of the buck's components."
    keys:
      l_h: {unit: H, convention: "filter inductance", range: {min: 0.0, min_inclusive: false}}
      c_f: {unit: F, convention: "output capacitance", range: {min: 0.0, min_inclusive: false}}
      r_l_ohm: {unit: ohm, convention: "inductor series resistance", range: {min: 0.0, min_inclusive: true}}
      i_max_a: {unit: A, convention: "inductor current limit of the controller", range: {min: 0.0, min_inclusive: false}}
  plecs_model_vars:
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    description: "PLECS plants only ('plecs:<profile_id>')."
  plecs_time_limit_s:
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    description: "PLECS plants only."
  plecs_output_points:
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    description: "PLECS plants only."
  dc_plant_solver:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1]
    not_applicable: [dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: optional
    range: null
    allowed_per_plant: {dc_perm_ex_v1: [euler, rk45], dc_pmg132_v1: [euler, rk45]}
    description: "Reference integration of the DC plant (studies only; None = one Euler step per period)."
  dc_plant_substeps:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1]
    not_applicable: [dc_perm_ex_v2, dc_pmg132_v2, pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: optional
    integer: true
    range: {min: 1, min_inclusive: true, max: 10000, max_inclusive: true}
    description: "Euler substeps per control period (with dc_plant_solver euler or unset)."
  dc_converter_model:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: optional
    range: null
    allowed_per_plant: {dc_perm_ex_v1: [gem, dcm], dc_pmg132_v1: [gem, dcm], dc_perm_ex_v2: [dcm_exact], dc_pmg132_v2: [dcm_exact]}
    description: "One-quadrant converter model (studies only; S-21). None/gem = GEM's, decided once per period; dcm = discontinuous conduction re-evaluated inside the period."
  load_torque_nm:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: N*m
    convention: "absolute passive load torque (Coulomb-type, opposes rotation), added to the default friction constant a (0.01 for the stock motor; 1 % of rated torque for another motor with known ratings)"
    importance: important
    range: {min: 0.0, min_inclusive: true}
    description: "Constant load torque; '20 % load' must be converted with the motor's rated torque by the caller."
  dc_supply_v:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: V
    convention: "DC link of the one-quadrant converter"
    importance: important
    range: {min: 0.0, min_inclusive: false}
    default_source: "runner.build_plant: 65 V (motor rated 60 V)"
    description: "Supply voltage."
  dc_limit_overrides:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: important
    range: null
    default_source: "dc_perm_ex_v1: DcPermanentlyExcitedMotor._default_limits, not derived from motor_parameter_overrides; dc_pmg132_v1: runner.PMG132_LIMITS; dc_perm_ex_v2 / dc_pmg132_v2: as their v1"
    description: "Motor limits: normalisation and the controllers' current cap (PI 0.8 x i, MPC 0.85 x i). u must not exceed dc_supply_v."
    keys:
      omega: {unit: rad/s, convention: "mechanical speed", range: {min: 0.0, min_inclusive: false}}
      torque: {unit: N*m, range: {min: 0.0, min_inclusive: false}}
      i: {unit: A, convention: "armature current; for a datasheet, the peak (short-time) current, not the continuous one", range: {min: 0.0, min_inclusive: false}}
      u: {unit: V, convention: "armature voltage", range: {min: 0.0, min_inclusive: false}}
  dc_nominal_overrides:
    applies_to: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2]
    not_applicable: [pmsm_v1, vsc_dpc_v1, buck_v1]
    unit: null
    importance: optional
    range: null
    default_source: "dc_perm_ex_v1: DcPermanentlyExcitedMotor._default_nominal_values; dc_pmg132_v1: runner.PMG132_NOMINAL_VALUES; dc_perm_ex_v2 / dc_pmg132_v2: as their v1"
    description: "Rated values (continuous duty, S1); the tuning's J_effort uses the rated current."
    keys:
      omega: {unit: rad/s, convention: "rated mechanical speed", range: {min: 0.0, min_inclusive: false}}
      torque: {unit: N*m, convention: "rated (continuous) torque", range: {min: 0.0, min_inclusive: false}}
      i: {unit: A, convention: "rated continuous current (S1)", range: {min: 0.0, min_inclusive: false}}
      u: {unit: V, convention: "rated armature voltage", range: {min: 0.0, min_inclusive: false}}
  pmsm_motor_parameters:
    applies_to: [pmsm_v1]
    not_applicable: [dc_perm_ex_v1, dc_pmg132_v1, dc_perm_ex_v2, dc_pmg132_v2, vsc_dpc_v1, buck_v1]
    unit: null
    importance: important
    range: null
    default_source: "control/classical/pmsm_foc.MOTOR_PARAMS (GEM PermanentMagnetSynchronousMotor), j_rotor GEM default, u_supply pmsm_foc.U_SUPPLY"
    description: "Partial override of the PMSM. MTPA assumes l_q >= l_d."
    keys:
      p: {unit: null, convention: "pole PAIRS, not poles", integer: true, range: {min: 1, min_inclusive: true}}
      l_d: {unit: H, convention: "d-axis inductance per phase (star equivalent); a line-to-line value is about 2x", range: {min: 0.0, min_inclusive: false}}
      l_q: {unit: H, convention: "q-axis inductance per phase (star equivalent)", range: {min: 0.0, min_inclusive: false}}
      r_s: {unit: ohm, convention: "stator resistance per phase (star equivalent) = R_line-line / 2; cold value", range: {min: 0.0, min_inclusive: false}}
      psi_p: {unit: V*s, convention: "permanent-magnet flux linkage, PEAK per phase (torque = 1.5*p*psi_p*i_q with amplitude-invariant dq)", range: {min: 0.0, min_inclusive: false}}
      j_rotor: {unit: kg*m^2, convention: "rotor inertia; the bench adds a 5 kg*m^2 load inertia", range: {min: 0.0, min_inclusive: false}}
      u_supply: {unit: V, convention: "DC link of the B6 bridge", range: {min: 0.0, min_inclusive: false}}
