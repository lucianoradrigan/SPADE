# SPADE assistant (round Assistant, phase 1, task F1.2). Read by driveflow.assistant.config.
#
# The assistant runs on a LOCAL model served by Ollama (decision B1, 2026-11-02): nothing leaves the
# machine. base_url must be a loopback address unless allow_remote_runtime is set explicitly, in
# which case every session warns and records it (change C4).
#
# The model is pinned by tag AND digest (B3). Both stay null until Luciano chooses the model after
# the comparison of task F1.1; until then the OllamaClient refuses to chat.

runtime: ollama
base_url: http://127.0.0.1:11434
allow_remote_runtime: false
timeout_s: 180

model:
  tag: null      # e.g. "<name>:<size>-<quantization>", chosen in F1.1
  digest: null   # sha256 from `ollama list` / GET /api/tags, chosen in F1.1

# Determinism (B3): temperature 0 and a fixed seed on every call.
temperature: 0
seed: 0
context_tokens: 16384
# Models that "think" before answering: false asks Ollama not to; null sends nothing.
think: false
# Output-token cap per model call (F1.1 round 2). The F1.1 timeouts were runaway generations (> 8000
# tokens in the 180 s timeout); normal calls used at most 393 tokens (think false) and 2126 (think true,
# p95 818). Thinking tokens count toward the cap.
num_predict: 2048
# Loop guards and nudges (F1.1 round 2, agreed with Luciano 2026-11-04; core/loop.py DEFAULT_GUARDS).
# The CLI and the Assistant page pass them to the Agent; Agent(guards=None) in code keeps them off.
guards:
  reject_repeats: true
  per_turn_caps: {search_docs: 2, explain_spade: 2}
  final_answer: true
  objective_needs_plant: true
  nudge_draft: true
  nudge_docs: true
  # Round 3 (Luciano 2026-11-04): SPADE data shown verbatim as cards (cards.py), verified citations,
  # "no lo tengo documentado" only after two empty distinct searches, glossary terms trigger the look-up.
  cards: true
  verified_cite: true
  nodoc_rule: true
  glossary_trigger: true

# Plan §4.4. driveflow.assistant.draft.DEFAULT_LIMITS must match (tests/assistant/test_assistant_llm.py).
limits:
  max_tool_calls_per_turn: 12
  max_experiments_per_launch: 50
  max_total_sim_seconds: 600
  # Bounded tool loop (task F1.3): one user turn never runs more than this.
  max_model_calls_per_turn: 16
  max_tokens_per_turn: 60000

# Avatar and visible identity of the assistant (task FE-2, decisions FE-D2, FE-D3, FE-D5). The images
# are Luciano Radrigan's likeness, NOT under SPADE's MIT license (licenses/avatar/). Point avatar_dir
# to another directory with base.webp and hand.webp to replace them; without them the page shows a
# neutral silhouette.
persona:
  name: "PhD. Radrigan"
  tagline: "AI assistant · local model"
  avatar_dir: src/driveflow/viz/assets/assistant
