cross_validation_note: 'Leave-bearing-out CV (6 holdout evals) shows this generic
  fit does NOT transfer well to individual unseen bearing samples: model RMSE was
  worse than a flat-PSD null model in 6/6 folds. Module B is a coarse physical approximation
