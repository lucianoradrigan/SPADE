# A2 follow-up: as rpi5_resnet1d_se_5class.yaml with a 2048-sample (205 ms) window, long enough to hold one cage
# period at 100 rad/s (cage ~6 Hz there); the 512-sample window holds a third of one.
# A2 (TODO_CLAUDE_CODE.md): same architecture as rpi5_resnet1d_se.yaml with 5 classes (healthy, outer_race,
# inner_race, ball, cage). Ball/cage amplitudes are synthetic-only, uncalibrated placeholders.
# Raspberry Pi 5-tier classifier config (docs/design_ai_layer_transversal.md Sec. 4.2/6.2,
# Sec. 8 step 8). Smaller than pc_server.yaml (2 blocks vs. 3, smaller dense head) -- trained by
# distillation from the promoted dc_motor/pc/classifier run, not from scratch
# (`python experiments/train_model.py --config configs/classifiers/rpi5_resnet1d_se.yaml
# --dataset ... --distill`). input_window MUST match pc_server.yaml's (512): distillation reuses
# the same windows for both teacher and student forward passes.
domain: dc_motor
tier: rpi5
input_window: 2048
num_classes: 5
blocks:
  - type: conv1d
    filters: 24
    kernel_size: 7
    use_se: true
  - type: conv1d
    filters: 32
    kernel_size: 5
    use_se: true
dense_units: [32]
dropout: 0.2
