# A2 follow-up: as pc_server_5class.yaml with a 2048-sample (205 ms) window, long enough to hold one cage
# period at 100 rad/s (cage ~6 Hz there); the 512-sample window holds a third of one.
# A2 (TODO_CLAUDE_CODE.md): same architecture as pc_server.yaml with 5 classes (healthy, outer_race,
# inner_race, ball, cage). Ball/cage amplitudes are synthetic-only, uncalibrated placeholders.
# PC-tier classifier config (docs/design_ai_layer_transversal.md Sec. 4.2/6.2, Sec. 8 step 4).
# "Modelo maestro" for the dc_motor domain -- no resource restriction, distillation targets
# (rpi5/esp32 presets) are deferred to Sec. 8 step 8, not authored yet.
domain: dc_motor
tier: pc
input_window: 2048
num_classes: 5
blocks:
  - type: conv1d
    filters: 32
    kernel_size: 7
    use_se: true
  - type: conv1d
    filters: 64
    kernel_size: 5
    use_se: true
  - type: conv1d
    filters: 64
    kernel_size: 3
    use_se: true
dense_units: [64]
dropout: 0.3
