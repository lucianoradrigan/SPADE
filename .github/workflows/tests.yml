name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev + viz extras)
        run: pip install -e ".[dev,viz]"

      - name: Check Transfer Learning / Agents scaffolding imports
        run: |
          python -c "from driveflow.ai.transfer import ModelLoader, DataMerger, TransferLearningPipeline, ModelValidator"
          python -c "from driveflow.agents import SimulationBasedAgent, DCMotorAnomalyDetector, VSCDPCAnomalyDetector, AnomalyDetector, AnomalyExplainer"

      - name: Run pytest
        run: pytest -v
