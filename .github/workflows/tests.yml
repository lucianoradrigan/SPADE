name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Unit + integration + short simulation tests. The >20 s tests (marker `slow`) run in
  # validation-scheduled.yml instead. No dataset download and no model training happens here.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev + viz extras)
        run: pip install -e ".[dev,viz]"

      - name: Verify dependency consistency
        run: pip check

      - name: Check Transfer Learning / Agents imports
        run: |
          python -c "from driveflow.ai.transfer import ModelLoader, DataMerger, TransferLearningPipeline, ModelValidator"
          python -c "from driveflow.agents import SimulationBasedAgent, DCMotorAnomalyDetector, VSCDPCAnomalyDetector, AnomalyDetector, AnomalyExplainer"

      - name: Run pytest (all categories except slow)
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: pytest -m "not slow" -v --durations=20

  # Installation smoke test (docs/INSTALL_*.md) on the three operating systems.
  # macos-latest is Apple Silicon; there is no Intel-Mac runner here (see docs/INSTALL_MACOS.md).
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev + viz extras)
        run: python -m pip install -e ".[dev,viz]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Smoke test (imports, app start + server health, modules, simulation, inference)
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python scripts/smoke_test.py --launch

      - name: Compatibility tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest -m compat -v

      # X3 (round PLECS/OM): the worker as a separate process on this OS -- start, heartbeat, a short
      # job, cancellation, clean stop (`python -m driveflow.jobs.worker stop`; Windows has no SIGTERM).
      # Also part of `-m compat` above; run on its own so a failure is visible per OS.
      - name: Worker life cycle (heartbeat, completion, cancellation, clean stop)
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest tests/jobs/test_worker_lifecycle.py -v
