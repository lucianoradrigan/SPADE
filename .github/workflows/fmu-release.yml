name: fmu release (draft)

# Round PLECS/OpenModelica, B8: builds SPADE's OpenModelica FMUs in the pinned container, re-runs
# the B3 GO/NO-GO script on that build, and creates a DRAFT GitHub Release with only the GO FMUs
# (X1: plus BuckAveraged Model Exchange compiled from its C sources on Windows and macOS, attached
# when B3's functional criteria pass on that OS; the latency criterion is recorded as measured)
# of each platform (minus DcMotorAveraged, decision G2), fmu_manifest.json and the licence texts
# (licenses/fmu/, review: docs/audit/plecs_om/b8_license_review.md). Publishing the draft is a
# manual decision of the maintainer; this workflow never publishes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (fmu-v*)"
        required: true
  push:
    tags: ["fmu-v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (fmu extra)
        run: pip install -e ".[dev,fmu]"

      - name: Build the FMUs (pinned OpenModelica image)
        run: bash scripts/fmu/build_fmus.sh

      - name: B3 GO/NO-GO on this build
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python experiments/report_b3_om_fmu_spike.py --out ci_out/b3

      - name: Build the Model Exchange variant and fetch the Reference FMUs (for the other OSes)
        run: mkdir -p data/fmu/variants && bash scripts/fmu/om.sh scripts/fmu/build_fmu_variants.mos && python scripts/fmu/fetch_reference_fmus.py

      - uses: actions/upload-artifact@v4
        with:
          name: fmu-build-linux
          path: |
            data/fmu/*.fmu
            data/fmu/manifest.json
            data/fmu/variants/BuckAveraged_fmi2_me.fmu
            data/fmu/reference/
            ci_out/b3/

  # X1: OpenModelica's pinned build is the Linux Docker image (no 1.27.1 Windows package, no official
  # macOS release), but its FMUs carry their C sources: compile the Model Exchange variant on each OS
  # and run B3's criteria there (docs/audit/plecs_om/x1_fmu_portability.md).
  other-os:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (fmu extra)
        run: pip install -e ".[fmu]"
      - uses: actions/download-artifact@v4
        with:
          name: fmu-build-linux
      - name: Compile BuckAveraged (Model Exchange) on this OS
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/fmu/compile_fmu_from_source.py data/fmu/variants/BuckAveraged_fmi2_me.fmu out/BuckAveraged_me.fmu --drop-existing-binaries --static-runtime --generator "MinGW Makefiles"
          else
            python scripts/fmu/compile_fmu_from_source.py data/fmu/variants/BuckAveraged_fmi2_me.fmu out/BuckAveraged_me.fmu --drop-existing-binaries
          fi
      - name: B3 criteria and Reference FMUs on this OS
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python experiments/report_x1_fmu_portability.py --buck-me out/BuckAveraged_me.fmu --reference-dir data/fmu/reference --out out/x1_${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: other-os-${{ runner.os }}
          path: out/

  draft-release:
    needs: [linux, other-os]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fmu-build-linux
      - uses: actions/download-artifact@v4
        with:
          pattern: other-os-*
          path: other
        continue-on-error: true

      - name: Assemble the release assets
        run: |
          extra=""
          for os in Windows macOS; do
            if [ -f other/other-os-$os/x1_$os.json ]; then extra="$extra --extra BuckAveraged other/other-os-$os/BuckAveraged_me.fmu other/other-os-$os/x1_$os.json"; fi
          done
          python scripts/fmu/make_release_bundle.py --fmu-dir data/fmu --b3 ci_out/b3/b3_om_fmu_spike.json --out release $extra

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd release
          gh release create "$TAG" --repo "${{ github.repository }}" --draft --target "${{ github.sha }}" \
            --title "SPADE OpenModelica FMUs $TAG (draft)" \
            --notes "Built by fmu-release.yml from ${{ github.sha }}. Linux: FMUs with a B3 GO verdict on this build. Windows/macOS: BuckAveraged Model Exchange compiled from its C sources on that OS, attached when B3's functional criteria pass there; each FMU's full B3 verdict (latency included) is in fmu_manifest.json, with not_attached. Licence texts: THIRD_PARTY_NOTICES.txt / licenses.zip. This product includes software developed by the University of Chicago, as Operator of Argonne National Laboratory. DRAFT: not published." \
            ./*.fmu fmu_manifest.json THIRD_PARTY_NOTICES.txt licenses.zip
