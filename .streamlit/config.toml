# SPADE design tokens for Streamlit's native widgets. Single source of truth is
# src/driveflow/viz/theme/tokens.py (DARK / LIGHT); tests/test_theme_tokens.py checks these values
# stay identical to it. Both themes are native, so the user can switch in the app menu
# (⋮ -> Settings -> Theme) without any CSS override of Streamlit internals.
[theme]
base = "dark"
font = "sans-serif"
baseRadius = "medium"

[theme.dark]
primaryColor = "#38BDF8"
backgroundColor = "#0B1525"
secondaryBackgroundColor = "#12263B"
textColor = "#E2E8F0"
borderColor = "#2B465D"
linkColor = "#38BDF8"

[theme.dark.sidebar]
backgroundColor = "#081321"

[theme.light]
primaryColor = "#0369A1"
backgroundColor = "#F5F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1E2E"
borderColor = "#C9D6E3"
linkColor = "#0369A1"

[theme.light.sidebar]
backgroundColor = "#EAF0F6"
